<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Расписание</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; color: #eee; }
    .card { background: #16213e; padding: 2rem; border-radius: 12px; width: 100%; max-width: 320px; }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; text-align: center; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #a0a0a0; }
    input { width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 1rem; border: 1px solid #3a3a5c; border-radius: 8px; background: #0f0f1a; color: #eee; font-size: 1rem; }
    input:focus { outline: none; border-color: #e94560; }
    button { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; background: #e94560; color: #fff; font-size: 1rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #ff6b6b; }
    .error { background: #3d1a1a; color: #ff6b6b; padding: 0.5rem 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход</h1>
    <div class="error" id="error"></div>
    <form id="form">
      <label>Логин</label>
      <input type="text" name="login" required autocomplete="username">
      <label>Пароль</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </div>
  <script>
    const API = window.location.origin;
    const form = document.getElementById('form');
    const errEl = document.getElementById('error');

    form.onsubmit = async (e) => {
      e.preventDefault();
      errEl.classList.remove('visible');
      const fd = new FormData(form);
      const body = { login: fd.get('login'), password: fd.get('password') };
      try {
        const r = await fetch(API + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const d = await r.json().catch(() => ({}));
          throw new Error(d.detail || 'Неверный логин или пароль');
        }
        const user = await r.json();
        if (user.role !== 'student' && user.role !== 'prepod') {
          throw new Error('Вход только для студентов и преподавателей');
        }
        sessionStorage.setItem('user', JSON.stringify(user));
        location.href = '/app/schedule.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('visible');
      }
    };
  </script>
</body>
</html>
